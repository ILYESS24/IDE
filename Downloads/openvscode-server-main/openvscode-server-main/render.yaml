services:
  - type: web
    name: openvscode-server
    runtime: node
    buildCommand: "echo 'Build handled by start script'"
    startCommand: "chmod +x render-start.sh && ./render-start.sh"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: openvscode-server
          property: port
      - key: VSCODE_SERVER_HOST
        value: 0.0.0.0
      - key: VSCODE_SERVER_PORT
        fromService:
          type: web
          name: openvscode-server
          property: port


